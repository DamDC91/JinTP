name: Build and Test

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Alire
      uses: alire-project/setup-alire@v4

    - name: Build library
      run: alr -n build

    - name: Run tests
      working-directory: tests
      run: alr -n run
